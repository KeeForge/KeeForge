<!doctype html><html><head><meta charset="utf-8"><title>Blocking listeners</title><script>
for (const t of ['pointerdown', 'mousedown', 'keydown', 'message', 'pagehide', 'popstate', 'hashchange', 'focusin', 'DOMContentLoaded']) { addEventListener(t, e => e.stopImmediatePropagation(), true); document.addEventListener(t, e => e.stopImmediatePropagation(), true); }
</script><style>:root{color-scheme:light dark;font:16px system-ui}body{margin:60px auto;width:460px}input{box-sizing:border-box;display:block;width:340px;height:40px;margin:12px 0;padding:8px;border:1px solid GrayText;border-radius:6px}</style></head><body><form><input id="u" autocomplete="username" placeholder="Username"><input id="p" type="password" autocomplete="current-password" placeholder="Password"></form></body></html>
