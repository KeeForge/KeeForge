<!doctype html><html><head><meta charset="utf-8"><title>Popover login</title><style>:root{color-scheme:light dark;font:16px system-ui}body{margin:60px auto;width:460px}input{box-sizing:border-box;display:block;width:340px;height:40px;margin:12px 0;padding:8px;border:1px solid GrayText;border-radius:6px}</style><style>[popover]{width:380px;padding:16px;border:1px solid GrayText;border-radius:12px}</style></head><body>
<div id="pop" popover="manual"><form><input id="u" autocomplete="username" placeholder="Username"><input id="p" type="password" autocomplete="current-password" placeholder="Password"></form></div>
<script>document.getElementById('pop').showPopover();</script></body></html>
