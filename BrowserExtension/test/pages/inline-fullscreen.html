<!doctype html><html><head><meta charset="utf-8"><title>Fullscreen login</title><style>:root{color-scheme:light dark;font:16px system-ui}body{margin:60px auto;width:460px}input{box-sizing:border-box;display:block;width:340px;height:40px;margin:12px 0;padding:8px;border:1px solid GrayText;border-radius:6px}</style><style>#full{background:Canvas;padding:60px}</style></head><body><button id="go" style="width:200px;height:40px">Fullscreen</button>
<div id="full"><form><input id="u" autocomplete="username" placeholder="Username"><input id="p" type="password" autocomplete="current-password" placeholder="Password"></form></div>
<script>document.getElementById('go').addEventListener('click', () => document.getElementById('full').requestFullscreen());</script></body></html>
