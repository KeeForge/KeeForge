<!doctype html><html><head><meta charset="utf-8"><title>Modal</title>
<style>body{margin:0;height:2000px;font:16px system-ui}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4)}.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:16px;overflow:hidden;width:360px;padding:24px;background:#fff}input{display:block;width:90%;margin:8px 0}</style></head><body>
<div class="backdrop"></div><div class="modal" role="dialog"><form><input id="u" autocomplete="username"><input id="p" type="password" autocomplete="current-password"></form></div>
</body></html>
