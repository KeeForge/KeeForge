<!doctype html><html><head><meta charset="utf-8"><title>Clipped sign-in</title><style>
:root{color-scheme:light dark;font:16px system-ui}body{margin:60px auto;width:460px}input{box-sizing:border-box;display:block;width:340px;height:40px;margin:12px 0;padding:8px;border:1px solid GrayText;border-radius:6px}
.card{clip-path:inset(0 round 12px);padding:16px;background:Canvas}
</style></head><body><p id="note">A rounded clip-path card: discovery rejects partial clips, so these fields get no key button.</p>
<div class="card"><form><input id="u" autocomplete="username" placeholder="Username"><input id="p" type="password" autocomplete="current-password" placeholder="Password"></form></div></body></html>
