<!doctype html><html><head><meta charset="utf-8"><title>Show-password fixture</title><style>
:root{color-scheme:light dark;font:16px system-ui}body{margin:60px auto;width:460px}.field{position:relative;width:340px;margin:12px 0}input{box-sizing:border-box;display:block;width:100%;height:40px;padding:8px 44px 8px 8px;border:1px solid GrayText;border-radius:6px;font:inherit}#reveal{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:4px;background:transparent;color:inherit;cursor:pointer;font-size:16px}h1{font-size:22px}
</style></head><body><h1>Sign in</h1><form><div class="field"><input id="u" autocomplete="username" placeholder="Email"></div><div class="field"><input id="p" type="password" autocomplete="current-password" placeholder="Password"><button id="reveal" type="button" aria-label="Show password">&#128065;</button></div></form>
<script>document.getElementById('reveal').onclick = () => { const p = document.getElementById('p'); p.type = p.type === 'password' ? 'text' : 'password'; };</script></body></html>
