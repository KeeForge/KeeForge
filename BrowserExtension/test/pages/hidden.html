<!doctype html><html><head><meta charset="utf-8"><title>Hidden fields</title></head><body>
<div id="slot"></div>
<form id="vf"><input id="vu"><input id="vp" type="password"></form>
<script>
const params = new URLSearchParams(location.search);
const wrap = {
  'display-none': '<div style="display:none">X</div>',
  'visibility-hidden': '<div style="visibility:hidden">X</div>',
  'opacity-0': '<div style="opacity:0"><div>X</div></div>',
  'offscreen': '<div style="position:absolute;left:-10000px;top:0">X</div>',
  'clip-path': '<div style="clip-path:inset(100%)">X</div>',
  'zero-size': '<div style="width:0;height:0;overflow:hidden">X</div>',
  'inert': '<div inert>X</div>',
  'closed-details': '<details><summary>More</summary>X</details>',
  'sr-only-clip': '<div style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">X</div>',
  'content-visibility': '<div style="content-visibility:hidden">X</div>',
  'zero-size-contain-paint': '<div style="width:0;height:0;contain:paint">X</div>',
  'contents-in-opacity-0': '<div style="opacity:0"><div style="display:contents">X</div></div>'
}[params.get('h')];
document.getElementById('slot').innerHTML = wrap.replace('X', '<form id="hf"><input id="hu" autocomplete="username"><input id="hp" type="password" autocomplete="current-password"></form>');
if (params.has('only')) document.getElementById('vf').remove();
</script>
</body></html>
