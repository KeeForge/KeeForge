<!doctype html><html><head><meta charset="utf-8"><title>Layout-only wrappers</title>
<style>.app{display:contents}.page{overflow-x:clip}.card{width:420px;margin:40px auto;overflow:hidden;border-radius:12px;border:1px solid #ccc;padding:24px}.row{display:contents}.field{overflow:hidden;border-radius:8px}input{display:block;width:100%;box-sizing:border-box;height:40px;margin:8px 0}</style></head><body>
<!-- Like x.com: a zero-size, non-clipping layer whose positioned child holds the form. -->
<div style="position:relative;width:0;height:0"><div style="position:fixed;inset:0;overflow:auto">
<div class="app"><div class="page"><div class="card"><form>
<div class="row"><input id="u" type="email" autocomplete="email"></div>
<div class="row"><div class="field"><input id="p" type="password" autocomplete="current-password"></div></div>
</form></div></div></div>
</div></div>
</body></html>
