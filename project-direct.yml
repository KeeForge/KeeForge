# Spec overlay for the notarized Developer ID (direct-download) macOS build.
#
#   xcodegen generate --spec project-direct.yml
#
# It produces the same project as `project.yml` with one difference: the
# `KeeForgeMac` target links Sparkle and compiles with KEEFORGE_DIRECT_DOWNLOAD,
# which turns on in-app updates and swaps the StoreKit tip jar for a GitHub
# Sponsors link.
#
# Why an overlay and not a second target: both channels must ship an app called
# KeeForge.app — the bundle name is user-visible and the executable name is
# baked into the signature, so it cannot be renamed after signing. Two targets
# in one project would therefore both declare the same product path, which
# Xcode rejects outright ("Multiple commands produce .../KeeForge.app"). Two
# specs keep the channels mutually exclusive by construction, which is what we
# want anyway: an App Store build must never contain Sparkle.
#
# ci_scripts/build_mac_direct.sh regenerates with this spec before archiving.
# Plain `xcodegen generate` always yields the App Store build, so no existing
# workflow changes and the default is the safe one.
include:
  - project.yml

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.6

targets:
  KeeForgeMac:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KEEFORGE_DIRECT_DOWNLOAD
        # project.yml blanks these at target level so the App Store build never
        # advertises an update feed. This is the only channel that links
        # Sparkle, so it is the only one that takes the project-level values
        # BuildConfig.local.xcconfig supplies.
        SPARKLE_FEED_URL: $(inherited)
        SPARKLE_PUBLIC_ED_KEY: $(inherited)
        # A sandboxed app cannot submit Sparkle's installer job itself; it has
        # to go through the InstallerLauncher XPC service, which stays inside
        # Sparkle.framework and must never be copied into the app bundle.
        # Turning it on also requires the two mach-lookup names below.
        SPARKLE_INSTALLER_LAUNCHER_SERVICE: "YES"
        # The only entitlement difference between the channels. See the
        # comments in the file itself.
        CODE_SIGN_ENTITLEMENTS: KeeForgeMac/KeeForgeMacDirect.entitlements
    # Appended to the dependencies project.yml already declares — XcodeGen
    # merges lists from an include rather than replacing them, so restating the
    # others here would register each one twice.
    dependencies:
      - package: Sparkle
  KeeForgeMacTests:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KEEFORGE_DIRECT_DOWNLOAD
