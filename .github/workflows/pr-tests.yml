name: PR Tests

# Required unit-test gate for pull requests.
#
# The earlier push/PR workflow (ci.yml) was demoted to manual dispatch because
# xcodebuild's raw exit code is unreliable on GitHub-hosted runners — green
# suites intermittently exit 65 during post-run teardown. This gate reuses the
# canonical-xcresult approach from ios18-rc-tests.yml: require a passing,
# nonempty canonical summary, so flaky teardown never fails a green run.
# Scope is unit tests only (KeeForgeTests);
# UI tests remain release-gated via rc/* tags.
#
# No base-branch filter: stacked pull requests target the branch below them
# in the stack, not main, and they need this gate too. The main and release/**
# rulesets require this job's `unit-tests` check.

on:
  pull_request:

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: KeeForge
      PROJECT: KeeForge.xcodeproj
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare build config
        env:
          DROPBOX_APP_KEY: ciplaceholderdropboxappkey
        run: BOOTSTRAP_LOCAL_CONFIG_FROM_ENV=1 ./ci_scripts/prepare_build_config.sh .

      - name: Generate project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            2>&1 | tee build/build-for-testing.log | xcpretty

      - name: Run unit tests
        run: |
          set -uo pipefail
          mkdir -p build
          log=build/unit.log
          result=build/unit.xcresult
          rm -rf "$result"

          # Judge success on the canonical xcresult, not xcodebuild's raw
          # exit code, a trailing console summary, or individual attempt lines:
          #   * GitHub runners intermittently return "** TEST EXECUTE FAILED **"
          #     (exit 65) during post-run teardown even on a fully green suite.
          #   * A flaky test can fail one attempt and pass on retry; that logs
          #     a "Test Case ... failed" line but is absorbed into a 0-failure
          #     total, so attempt lines must NOT fail the job.
          # The authoritative verdict is the canonical xcresult summary. Raw
          # output remains available for diagnosis via the uploaded logs.
          set +e
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:KeeForgeTests \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -resultBundlePath "$result" \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          echo "KeeForgeTests: xcodebuild exit=$status"

          if ! python3 ci_scripts/validate_xcresult_summary.py \
            --result-bundle "$result" --suite KeeForgeTests --xcodebuild-exit "$status"; then
            exit 1
          fi

          # Attempt lines do not decide the verdict. Surface retried attempts
          # as warnings so flakes remain visible.
          flaked=$(grep -oE "Test Case '[^']*' failed" "$log" | sort -u || true)
          if [ -n "$flaked" ]; then
            echo "::warning::KeeForgeTests: passed with retries; the following attempt(s) failed once then passed:"
            echo "$flaked"
          fi

      - name: Upload test logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-unit-test-results
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  macos-unit-tests:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: KeeForgeMac
      PROJECT: KeeForge.xcodeproj
      DESTINATION: 'platform=macOS'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare build config
        env:
          DROPBOX_APP_KEY: ciplaceholderdropboxappkey
        run: BOOTSTRAP_LOCAL_CONFIG_FROM_ENV=1 ./ci_scripts/prepare_build_config.sh .

      - name: Generate project
        run: xcodegen generate

      # Runners have no signing account, so the app is ad-hoc signed with no
      # entitlements (unsandboxed). Local runs keep automatic signing with the
      # full sandbox entitlements — see project.yml.
      - name: Run macOS unit tests
        run: |
          set -uo pipefail
          mkdir -p build
          log=build/macos-unit.log
          result=build/macos-unit.xcresult
          rm -rf "$result"

          # Same canonical-xcresult rule as the iOS job above.
          set +e
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:KeeForgeMacTests \
            -skipPackagePluginValidation \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -resultBundlePath "$result" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          echo "KeeForgeMacTests: xcodebuild exit=$status"

          if ! python3 ci_scripts/validate_xcresult_summary.py \
            --result-bundle "$result" --suite KeeForgeMacTests --xcodebuild-exit "$status"; then
            exit 1
          fi

          flaked=$(grep -oE "Test Case '[^']*' failed" "$log" | sort -u || true)
          if [ -n "$flaked" ]; then
            echo "::warning::KeeForgeMacTests: passed with retries; the following attempt(s) failed once then passed:"
            echo "$flaked"
          fi

      - name: Upload test logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-macos-unit-test-results
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: warn
          retention-days: 14
