name: iOS 18 UI Regression
run-name: iOS 18 UI regression — ${{ inputs.source_ref }} — ${{ inputs.scope }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch to test
        required: true
        default: main
      test_helpers_ref:
        description: Optional ref supplying test helpers while keeping the app at source_ref
        required: false
      scope:
        description: Five b60 failures or their complete test classes
        type: choice
        options: [failed-tests, affected-classes]
        default: failed-tests
      repetitions:
        description: Independent repetitions (failures are never retried away)
        type: choice
        options: ['1', '3', '5']
        default: '3'

permissions:
  contents: read

jobs:
  ios18-ui:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test-class: [EntryDeleteSmokeUITests, GroupEditUITests, SearchResultsDeleteUITests, SearchResultsMoveUITests]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Apply test helpers from comparison ref
        if: inputs.test_helpers_ref != ''
        env:
          TEST_HELPERS_REF: ${{ inputs.test_helpers_ref }}
        run: |
          git fetch --depth=1 origin "$TEST_HELPERS_REF"
          mkdir -p build
          git rev-parse FETCH_HEAD | tee build/test-helpers-revision.log
          git checkout FETCH_HEAD -- KeeForgeUITests/EntryEditUITests.swift \
            KeeForgeUITests/KeeForgeUITestCase.swift

      - name: Record environment
        run: |
          mkdir -p build
          {
            git rev-parse HEAD
            git diff --cached --stat
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
          } | tee build/environment.log

      - name: Prepare project
        env:
          DROPBOX_APP_KEY: ciplaceholderdropboxappkey
        run: |
          brew install xcodegen
          BOOTSTRAP_LOCAL_CONFIG_FROM_ENV=1 ./ci_scripts/prepare_build_config.sh .
          xcodegen generate

      - name: Create iPhone SE on iOS 18.6
        id: sim
        timeout-minutes: 10
        run: |
          set -euo pipefail
          udid=$(xcrun simctl create KeeForge-iOS18-Repro \
            com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation \
            com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Build for testing
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project KeeForge.xcodeproj -scheme KeeForge \
            -destination "platform=iOS Simulator,id=$UDID" \
            -skipPackagePluginValidation > build/build.log 2>&1

      - name: Run regression tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          SCOPE: ${{ inputs.scope }}
          REPETITIONS: ${{ inputs.repetitions }}
          TEST_CLASS: ${{ matrix.test-class }}
        run: |
          set -uo pipefail
          run_class() {
            local class="$1"
            shift
            local selection=()
            if [ "$SCOPE" = affected-classes ]; then
              selection+=("-only-testing:KeeForgeUITests/$class")
            else
              for method in "$@"; do
                selection+=("-only-testing:KeeForgeUITests/$class/$method")
              done
            fi
            if [ "$REPETITIONS" -gt 1 ]; then
              selection+=(-test-iterations "$REPETITIONS" -test-repetition-relaunch-enabled YES)
            fi
            local result="build/$class.xcresult" log="build/$class.log"
            xcodebuild test-without-building -project KeeForge.xcodeproj -scheme KeeForge \
              -destination "platform=iOS Simulator,id=$UDID" \
              "${selection[@]}" \
              -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
              -resultBundlePath "$result" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            python3 ci_scripts/validate_xcresult_summary.py \
              --result-bundle "$result" --suite "$class" --xcodebuild-exit "$status" || return 1
            # This diagnostic workflow requires every attempt to pass.
            if grep -qE "Test Case '.*' failed" "$log"; then
              echo "::error::$class had a failed attempt"
              return 1
            fi
          }
          case "$TEST_CLASS" in
            EntryDeleteSmokeUITests)
              run_class "$TEST_CLASS" testRecycleBinGroupHasNoDeleteSwipeAction || exit 1 ;;
            GroupEditUITests)
              run_class "$TEST_CLASS" testRecycleBinOffersNoEditGroupContextAction || exit 1 ;;
            SearchResultsDeleteUITests)
              run_class "$TEST_CLASS" \
                testContextMenuDeleteFromSearchResultsMovesEntryToRecycleBin \
                testSwipeDeleteFromSearchResultsConfirmsBeforeDeleting || exit 1 ;;
            SearchResultsMoveUITests)
              run_class "$TEST_CLASS" testContextMenuMoveFromSearchResultsMovesEntryToChosenGroup || exit 1 ;;
          esac

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios18-ui-regression-${{ matrix.test-class }}
          path: |
            build/*.log
            build/*.xcresult
          retention-days: 14
