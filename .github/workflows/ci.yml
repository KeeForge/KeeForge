name: CI (Manual)

on:
  # Automatic runs stay disabled: this workflow judges success on xcodebuild's
  # raw exit code, which is too flaky on GitHub runners for push/PR noise.
  # The required PR gate is pr-tests.yml (aggregate-verdict unit tests);
  # manual dispatch keeps this fuller build+test matrix available on demand.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SCHEME: KeeForge
      PROJECT: KeeForge.xcodeproj
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare build config
        env:
          DROPBOX_APP_KEY: ciplaceholderdropboxappkey
        run: BOOTSTRAP_LOCAL_CONFIG_FROM_ENV=1 ./ci_scripts/prepare_build_config.sh .

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            | xcpretty

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:KeeForgeTests \
            | xcpretty

      # UI tests disabled in CI — simulator-dependent and flaky on GitHub runners
      # - name: Run UI tests
      #   if: github.event_name == 'pull_request'
      #   run: |
      #     set -o pipefail
      #     xcodebuild test-without-building \
      #       -project "$PROJECT" \
      #       -scheme "$SCHEME" \
      #       -destination "$DESTINATION" \
      #       -only-testing:KeeForgeUITests \
      #       | xcpretty

  macos-build-and-test:
    # macos-26, not macos-15: macos-15 tops out at Xcode 26.3, whose actool
    # crashes compiling the KeeForge.icon Icon Composer bundle for the macOS
    # platform (it compiles the same .icon for iOS fine, which is why
    # build-and-test above stays on macos-15). Same reason pr-tests.yml's
    # macos-unit-tests and the macos-rc-tests gate run there.
    runs-on: macos-26
    # The Mac suite alone runs 22-32 minutes on this runner class.
    timeout-minutes: 45
    env:
      SCHEME: KeeForgeMac
      PROJECT: KeeForge.xcodeproj
      DESTINATION: 'platform=macOS'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Latest available, which on macos-26 is Xcode 26.6.
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

          # Fail loudly rather than crashing inside actool two minutes later.
          # Xcode 26.3 segfaults compiling KeeForge.icon for macOS; 26.6 is the
          # verified-good version and the one Xcode Cloud uses.
          version=$(xcodebuild -version | awk 'NR==1{print $2}')
          if [ "$(printf '%s\n26.4\n' "$version" | sort -V | head -1)" != "26.4" ]; then
            echo "::error::Xcode $version is too old for the macOS asset-catalog build (26.3 crashes in actool on KeeForge.icon). Expected 26.4+ on this runner."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare build config
        env:
          DROPBOX_APP_KEY: ciplaceholderdropboxappkey
        run: BOOTSTRAP_LOCAL_CONFIG_FROM_ENV=1 ./ci_scripts/prepare_build_config.sh .

      - name: Generate project
        run: xcodegen generate

      # CI runners have no signing account, so the app is ad-hoc signed with
      # no entitlements (unsandboxed). Local runs keep automatic signing with
      # the full sandbox entitlements — see project.yml.
      - name: Build and run macOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:KeeForgeMacTests \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | xcpretty
