name: iOS 18 RC Tests

# Minimum-OS coverage that Xcode Cloud cannot currently provide: since the
# deployment target moved to iOS 18, its "Tests (RC)" action can only pin the
# latest runtime (iOS 26.5) or iOS 16.4 — there is no iOS 18.x runtime to pin.
# GitHub-hosted macos-15 runners do ship iOS 18.0–18.5 runtimes, so this job
# runs the full unit + UI suites on an iOS 18 simulator to catch minimum-OS
# regressions (like the iOS 17 editor-navigation hang that motivated dropping
# iOS 17).
#
# Trigger mirrors the Xcode Cloud RC gate (rc/* tag push) and also allows manual
# dispatch. This workflow and Xcode Cloud are both release gates documented in
# .agents/skills/release/SKILL.md. The job ignores the rc/* deletion event emitted
# when the release skill atomically promotes the successful RC tag to v*.

on:
  push:
    tags:
      - 'rc/*'
  workflow_dispatch:

concurrency:
  group: ios18-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios18-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: macos-15
    # Full unit + UI suites on a single (non-parallel) runner run longer than
    # Xcode Cloud's 4-way-parallel RC run; give them room.
    timeout-minutes: 120
    env:
      SCHEME: KeeForge
      PROJECT: KeeForge.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest stable Xcode on the runner — the same one that builds
          # the project elsewhere — rather than pinning an older Xcode that may
          # not compile the current sources. A modern Xcode can still drive an
          # older (iOS 18) simulator runtime.
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare build config
        env:
          DROPBOX_APP_KEY: CI_PLACEHOLDER_DROPBOX_APP_KEY
        run: BOOTSTRAP_LOCAL_CONFIG_FROM_ENV=1 ./ci_scripts/prepare_build_config.sh .

      - name: Generate project
        run: xcodegen generate

      - name: Create iOS 18 simulator
        id: sim
        run: |
          set -euo pipefail
          echo "Installed runtimes:"
          xcrun simctl list runtimes

          # Pick the newest installed, available iOS 18.x runtime. Fail loudly if
          # the runner image has rotated the iOS 18 runtimes out (Apple/GitHub
          # periodically deprecate older simulator runtimes on macos-15).
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          runtimes = [
              r for r in json.load(sys.stdin)["runtimes"]
              if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-18")
          ]
          runtimes.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          if not runtimes:
              sys.exit("No iOS 18.x simulator runtime is available on this runner image.")
          print(runtimes[-1]["identifier"])
          ')
          echo "Using runtime: $RUNTIME"

          # iPhone SE (3rd gen): compact width, which is the layout that surfaced
          # the iOS 17 editor-navigation hang this job exists to catch.
          UDID=$(xcrun simctl create "KeeForge-iOS18" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation" "$RUNTIME")
          echo "Created simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            2>&1 | tee build/build-for-testing.log | xcpretty

      - name: Run tests (iOS 18)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          mkdir -p build

          # Run one test bundle and judge success on the aggregate test result,
          # not xcodebuild's raw exit code or individual attempt lines:
          #   * GitHub runners intermittently return "** TEST EXECUTE FAILED **"
          #     (exit 65) during post-run teardown even on a fully green suite.
          #   * A flaky UI test can fail one attempt and pass on retry; that logs
          #     a "Test Case ... failed" line but is absorbed into a 0-failure
          #     total, so attempt lines must NOT fail the job.
          # The authoritative verdict is XCTest's summary failure count. Raw
          # output is captured verbatim (no xcpretty, which swallows the
          # underlying error) for diagnosis via the uploaded logs.
          run_suite() {
            local suite="$1" name="$2" log="build/$2.log"
            echo "::group::xcodebuild test — $suite"
            set +e
            xcodebuild test-without-building \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,id=$UDID" \
              -only-testing:"$suite" \
              -resultBundlePath "build/$name.xcresult" \
              2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            echo "$suite: xcodebuild exit=$status"

            # Highest failure count across all "Executed N tests, ... M failures"
            # summary lines (empty if xcodebuild never produced a summary).
            local maxfail
            maxfail=$(grep -oE "[0-9]+ failures? \(" "$log" | grep -oE "^[0-9]+" | sort -rn | head -1)

            if [ -z "$maxfail" ]; then
              echo "::error::$suite: no test summary produced (xcodebuild exit=$status); tests did not run — see uploaded logs."
              return 1
            fi
            if [ "$maxfail" -gt 0 ]; then
              echo "::error::$suite: $maxfail test failure(s) remained after retries."
              return 1
            fi

            # 0 failures overall. Surface any retried-then-passed attempts as a
            # warning so flakes stay visible without failing the job.
            local flaked
            flaked=$(grep -oE "Test Case '[^']*' failed" "$log" | sort -u || true)
            if [ -n "$flaked" ]; then
              echo "::warning::$suite: passed with retries; the following attempt(s) failed once then passed:"
              echo "$flaked"
            fi
            if [ "$status" -ne 0 ]; then
              echo "::warning::$suite: 0 failures but xcodebuild exited $status (post-run teardown artifact); treating as success."
            fi
            echo "$suite: PASS (0 failures)"
            return 0
          }

          rc=0
          run_suite "KeeForgeTests" "unit" || rc=1
          run_suite "KeeForgeUITests" "ui" || rc=1
          exit "$rc"

      - name: Upload test logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios18-test-results
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: warn
          retention-days: 14
