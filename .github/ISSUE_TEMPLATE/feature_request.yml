name: Feature request
description: Suggest an idea or improvement for KeeForge
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: I'm always frustrated when …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried, including how other KeePass apps handle this.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, links, or additional context.
