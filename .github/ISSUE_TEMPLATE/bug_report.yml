name: Bug report
description: Something isn't working correctly in KeeForge
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **Never attach a real database, master password, key file, or screenshots showing real credentials.** If a specific database triggers the bug, describe how it was created (source app, KDF, cipher) or attach a throwaway test database instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a database from …
        2. Tap …
        3. See error
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: KeeForge version
      description: Settings → About, or the App Store listing.
      placeholder: e.g. 1.4.2
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version and device
      placeholder: e.g. iOS 18.5, iPhone 15 Pro
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the bug occur?
      multiple: true
      options:
        - Main app (browsing / unlocking)
        - Editing / saving
        - AutoFill extension
        - Passkeys
        - TOTP
        - Cloud / file sync
        - Other
    validations:
      required: true
  - type: textarea
    id: database-details
    attributes:
      label: Database details (if relevant)
      description: App that created the database, KDBX version, KDF (Argon2/AES-KDF), key file usage — no secrets.
      placeholder: e.g. Created with KeePassXC 2.7, KDBX 4.1, Argon2id, no key file
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots (with secrets redacted), or other context.
