name: KeeForge
options:
  bundleIdPrefix: com.keevault
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"
configFiles:
  Debug: Configs/BuildConfig.xcconfig
  Release: Configs/BuildConfig.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  KeeForgeTwofish:
    path: Vendor/KeeForgeTwofish
  Argon2Swift:
    url: https://github.com/tmthecoder/Argon2Swift.git
    revision: 53543623fefe68461b7eeea03d7f96677c2fd76d
  SwiftyDropbox:
    url: https://github.com/dropbox/SwiftyDropbox.git
    from: 10.0.7
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc.git
    from: 1.7.0
  swift-psl:
    url: https://github.com/ameshkov/swift-psl.git
    from: 1.1.161
targets:
  KeeForge:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_FILE: KeeForge/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: KeeForge
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KeeForge/KeeForge.entitlements
        PRODUCT_NAME: KeeForge
        PRODUCT_MODULE_NAME: KeeForge
        MARKETING_VERSION: "1.13.0"
        CURRENT_PROJECT_VERSION: "2"
        CLOUD_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)com.keevault.sharedkeychain
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    dependencies:
      - target: KeeForgeAutoFill
        embed: true
        codeSign: true
      - package: Argon2Swift
      - package: KeeForgeTwofish
      - package: SwiftyDropbox
      - package: MSAL
      - package: swift-psl
        product: PublicSuffixList
    sources:
      # KeeForgeCommands.swift (menu bar) and MacLockMonitor.swift (lock
      # lifecycle) are macOS-only: members of KeeForgeMac, excluded here.
      - path: KeeForge/App
        excludes: ["README.md", "KeeForgeCommands.swift"]
      - path: KeeForge/Models
        excludes: ["README.md"]
      - path: KeeForge/Services
        excludes: ["README.md", "**/README.md", "AppSupport/MacLockMonitor.swift"]
      - path: KeeForge/ViewModels
        excludes: ["README.md"]
      - path: KeeForge/Views
        excludes: ["README.md"]
      - path: KeeForge/Extensions
        excludes: ["README.md"]
      - path: KeeForge/Resources
        excludes: ["README.md"]
      # Platform-neutral AutoFill coordinator is compiled into the app target
      # too so KeeForgeTests (hosted by the app) can unit-test it.
      - path: AutoFillExtension/CredentialProviderCoordinator.swift
      - path: KeeForge.icon
        buildPhase: resources

  KeeForgeMac:
    type: application
    platform: macOS
    settings:
      base:
        INFOPLIST_FILE: KeeForgeMac/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app
        # Reuse the shared Icon Composer bundle (KeeForge.icon) so the Mac app
        # has an archivable icon; lower-risk than bumping xcodeVersion since
        # the installed Xcode (26.x) already compiles it for the iOS target.
        ASSETCATALOG_COMPILER_APPICON_NAME: KeeForge
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KeeForgeMac/KeeForgeMac.entitlements
        PRODUCT_NAME: KeeForgeMac
        PRODUCT_MODULE_NAME: KeeForge
        MARKETING_VERSION: "1.10.1"
        CURRENT_PROJECT_VERSION: "1"
        CLOUD_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)com.keevault.sharedkeychain
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    dependencies:
      - target: KeeForgeMacAutoFill
        embed: true
        codeSign: true
      - package: Argon2Swift
      - package: KeeForgeTwofish
      - package: SwiftyDropbox
      - package: MSAL
      - package: swift-psl
        product: PublicSuffixList
    sources:
      - path: KeeForge/App
        excludes: ["README.md"]
      - path: KeeForge/Models
        excludes: ["README.md"]
      - path: KeeForge/Services
        excludes: ["README.md", "**/README.md"]
      - path: KeeForge/ViewModels
        excludes: ["README.md"]
      - path: KeeForge/Views
        excludes: ["README.md"]
      - path: KeeForge/Extensions
        excludes: ["README.md"]
      - path: KeeForge/Resources
        excludes: ["README.md", "LaunchScreen.storyboard"]
      # Platform-neutral AutoFill coordinator is compiled into the Mac app target
      # too so KeeForgeMacTests (hosted by the app) can unit-test it — mirrors the
      # iOS KeeForge target. Its save/generate-password paths compile out on macOS.
      - path: AutoFillExtension/CredentialProviderCoordinator.swift
      # The macOS AutoFill shell (and the picker view it hosts) are compiled into
      # the app target as well so KeeForgeMacTests can exercise the shell's
      # cleanup routing (shell lifecycle tests). Both are `#if os(macOS)` / macOS-
      # compatible; nothing in the app references them at runtime.
      - path: AutoFillExtension/CredentialProviderViewControllerMac.swift
      - path: AutoFillExtension/AutoFillSearchView.swift
      - path: KeeForge.icon
        buildPhase: resources

  KeeForgeAutoFill:
    type: app-extension
    platform: iOS
    settings:
      base:
        INFOPLIST_FILE: AutoFillExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app.autofill
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AutoFillExtension/AutoFillExtension.entitlements
        MARKETING_VERSION: "1.13.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    dependencies:
      - package: Argon2Swift
      - package: KeeForgeTwofish
      - package: swift-psl
        product: PublicSuffixList
    sources:
      # Exclude the macOS-only Info.plist / entitlements so they are not bundled
      # as stray resources in the iOS extension.
      - path: AutoFillExtension
        excludes: ["README.md", "InfoMac.plist", "AutoFillExtensionMac.entitlements"]
      - path: KeeForge/Models
        excludes: ["README.md"]
      # >>> SHARED AUTOFILL ALLOW-LIST (maintenance invariant) >>>
      # These explicit service/view paths MUST stay literally identical — same
      # paths, same order — to the KeeForgeMacAutoFill target below. The two
      # AutoFill extensions share exactly this source set; divergence silently
      # breaks one platform's extension. Edit both lists together.
      - path: KeeForge/Services/Security/BiometricService.swift
      - path: KeeForge/Services/Security/SecureRandom.swift
      - path: KeeForge/Services/Persistence/DocumentPickerService.swift
      - path: KeeForge/Services/AutoFill/AutoFillSaveCoordinator.swift
      - path: KeeForge/Services/AutoFill/AutoFillMemoryLimit.swift
      - path: KeeForge/Services/AutoFill/AutoFillDiagnostics.swift
      - path: KeeForge/Services/Persistence/DatabaseListStore.swift
      - path: KeeForge/Services/Security/KeychainService.swift
      - path: KeeForge/Services/AppSupport/SettingsService.swift
      - path: KeeForge/Services/Persistence/SharedVaultStore.swift
      - path: KeeForge/Services/AutoFill/CredentialMatcher.swift
      - path: KeeForge/Services/AutoFill/CredentialIdentityStoreManager.swift
      - path: KeeForge/Services/AppSupport/FaviconService.swift
      # iOS branch backs the opt-in "copy verification code on AutoFill" copy
      # (system-enforced pasteboard expiration survives extension teardown).
      # The macOS extension compiles the AppKit branch but never calls it —
      # the coordinator gates the behavior on `#if os(iOS)`.
      - path: KeeForge/Services/AppSupport/ClipboardService.swift
      - path: KeeForge/Services/Persistence/CoordinatedFileReader.swift
      - path: KeeForge/Services/Persistence/KeyFileProcessor.swift
      - path: KeeForge/Services/Persistence/LocalDatabaseSaver.swift
      - path: KeeForge/Services/Security/PasskeyCrypto.swift
      - path: KeeForge/Services/Cloud/PendingUploadQueue.swift
      - path: KeeForge/Services/AutoFill/PasswordGenerator.swift
      - path: KeeForge/Services/AutoFill/PasswordStrengthEstimator.swift
      - path: KeeForge/Views/PasswordDisplay.swift
      - path: KeeForge/Views/PasswordInputRow.swift
      - path: KeeForge/Services/Persistence/SecurityScopedBookmarkManager.swift
      - path: KeeForge/Extensions/PlatformCompat.swift
      # <<< SHARED AUTOFILL ALLOW-LIST (maintenance invariant) <<<

  KeeForgeMacAutoFill:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        INFOPLIST_FILE: AutoFillExtension/InfoMac.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app.autofill
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AutoFillExtension/AutoFillExtensionMac.entitlements
        MARKETING_VERSION: "1.10.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    dependencies:
      - package: Argon2Swift
      - package: KeeForgeTwofish
      - package: swift-psl
        product: PublicSuffixList
    sources:
      # Exclude the iOS-only Info.plist / entitlements so they are not bundled
      # as stray resources in the macOS extension. The macOS presentation shell
      # (CredentialProviderViewControllerMac.swift) lives beside the iOS shell in
      # this folder, each gated by `#if os()`.
      - path: AutoFillExtension
        excludes: ["README.md", "Info.plist", "AutoFillExtension.entitlements"]
      - path: KeeForge/Models
        excludes: ["README.md"]
      # >>> SHARED AUTOFILL ALLOW-LIST (maintenance invariant) >>>
      # MUST stay literally identical — same paths, same order — to the
      # KeeForgeAutoFill target above. See the note there. Edit both together.
      - path: KeeForge/Services/Security/BiometricService.swift
      - path: KeeForge/Services/Security/SecureRandom.swift
      - path: KeeForge/Services/Persistence/DocumentPickerService.swift
      - path: KeeForge/Services/AutoFill/AutoFillSaveCoordinator.swift
      - path: KeeForge/Services/AutoFill/AutoFillMemoryLimit.swift
      - path: KeeForge/Services/AutoFill/AutoFillDiagnostics.swift
      - path: KeeForge/Services/Persistence/DatabaseListStore.swift
      - path: KeeForge/Services/Security/KeychainService.swift
      - path: KeeForge/Services/AppSupport/SettingsService.swift
      - path: KeeForge/Services/Persistence/SharedVaultStore.swift
      - path: KeeForge/Services/AutoFill/CredentialMatcher.swift
      - path: KeeForge/Services/AutoFill/CredentialIdentityStoreManager.swift
      - path: KeeForge/Services/AppSupport/FaviconService.swift
      # iOS branch backs the opt-in "copy verification code on AutoFill" copy
      # (system-enforced pasteboard expiration survives extension teardown).
      # The macOS extension compiles the AppKit branch but never calls it —
      # the coordinator gates the behavior on `#if os(iOS)`.
      - path: KeeForge/Services/AppSupport/ClipboardService.swift
      - path: KeeForge/Services/Persistence/CoordinatedFileReader.swift
      - path: KeeForge/Services/Persistence/KeyFileProcessor.swift
      - path: KeeForge/Services/Persistence/LocalDatabaseSaver.swift
      - path: KeeForge/Services/Security/PasskeyCrypto.swift
      - path: KeeForge/Services/Cloud/PendingUploadQueue.swift
      - path: KeeForge/Services/AutoFill/PasswordGenerator.swift
      - path: KeeForge/Services/AutoFill/PasswordStrengthEstimator.swift
      - path: KeeForge/Views/PasswordDisplay.swift
      - path: KeeForge/Views/PasswordInputRow.swift
      - path: KeeForge/Services/Persistence/SecurityScopedBookmarkManager.swift
      - path: KeeForge/Extensions/PlatformCompat.swift
      # <<< SHARED AUTOFILL ALLOW-LIST (maintenance invariant) <<<

  KeeForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: KeeForge
    dependencies:
      - target: KeeForge
    sources:
      - path: KeeForgeUITests
        excludes: ["README.md"]
      - path: TestFixtures/test.kdbx
        buildPhase: resources
      - path: TestFixtures/demo.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.key
        buildPhase: resources
      - path: TestFixtures/invalid-xml.keyx
        buildPhase: resources
      - path: TestFixtures/compatibility/attachments.kdbx
        buildPhase: resources
      - path: TestFixtures/autofill-union.kdbx
        buildPhase: resources
      - path: TestFixtures/tag-browser.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/group-tags.kdbx
        buildPhase: resources
      - path: TestFixtures/protected-custom-field.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/legacy-kdbx31.kdbx
        buildPhase: resources
      - path: TestFixtures/icon-picker.kdbx
        buildPhase: resources

  KeeForgeTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: KeeForge
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KeeForge.app/KeeForge"
    # Copy the four RAW .xcstrings catalog sources verbatim into the built
    # .xctest bundle so LocalizationTests can read them from its own bundle at
    # runtime. On Xcode Cloud the test action ("test-without-building") runs on
    # separate machines that DON'T have the source checkout at
    # /Volumes/workspace/repository, so reading catalogs off disk fails there.
    # Bundling them makes the catalogs travel with the test artifacts.
    # Names are disambiguated (two Localizable.xcstrings, two InfoPlist.xcstrings
    # would otherwise collide). The catalogs are copied by a script — NOT added
    # as target resources — so Xcode does not compile them (a compiled catalog
    # drops the per-key `state` field the test inspects).
    postCompileScripts:
      - name: Bundle raw .xcstrings catalogs for LocalizationTests
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/KeeForge/Resources/Localizable.xcstrings
          - $(SRCROOT)/KeeForge/Resources/InfoPlist.xcstrings
          - $(SRCROOT)/AutoFillExtension/Localizable.xcstrings
          - $(SRCROOT)/AutoFillExtension/InfoPlist.xcstrings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/KeeForge_Localizable.xcstrings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/KeeForge_InfoPlist.xcstrings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AutoFillExtension_Localizable.xcstrings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AutoFillExtension_InfoPlist.xcstrings
        script: |
          set -euo pipefail

          # TARGET_BUILD_DIR (not BUILT_PRODUCTS_DIR) is the location the test
          # bundle is actually assembled and run from — for a host-app-embedded
          # unit test that is KeeForge.app/PlugIns/KeeForgeTests.xctest, which is
          # what Bundle(for:) resolves to at runtime.
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${dest}"

          copy_catalog() {
            src="$1"
            dst="$2"
            if [ ! -f "${src}" ]; then
              echo "error: raw xcstrings source missing: ${src}" >&2
              exit 1
            fi
            /bin/cp -f "${src}" "${dest}/${dst}"
          }

          copy_catalog "${SRCROOT}/KeeForge/Resources/Localizable.xcstrings" "KeeForge_Localizable.xcstrings"
          copy_catalog "${SRCROOT}/KeeForge/Resources/InfoPlist.xcstrings" "KeeForge_InfoPlist.xcstrings"
          copy_catalog "${SRCROOT}/AutoFillExtension/Localizable.xcstrings" "AutoFillExtension_Localizable.xcstrings"
          copy_catalog "${SRCROOT}/AutoFillExtension/InfoPlist.xcstrings" "AutoFillExtension_InfoPlist.xcstrings"
    dependencies:
      - target: KeeForge
      - package: KeeForgeTwofish
    sources:
      - path: KeeForgeTests
        excludes: ["README.md"]
      - path: TestFixtures/test.kdbx
        buildPhase: resources
      - path: TestFixtures/demo.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.kdbx
        buildPhase: resources
      - path: TestFixtures/round-trip/unknown-elements.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/aes-baseline.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/password-keyfile.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/password-keyfile.key
        buildPhase: resources
      - path: TestFixtures/compatibility/unknown-rich.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/kdbx41-public-custom-data.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/legacy-kdbx31.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/attachments.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/foreign-chacha20.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/foreign-twofish.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/group-tags.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/unknown-inner-header.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/argon2-high-iterations.kdbx
        buildPhase: resources
      - path: TestFixtures/test-v3-backup.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.key
        buildPhase: resources
      - path: TestFixtures/test-binary.key
        buildPhase: resources
      - path: TestFixtures/test-hex.key
        buildPhase: resources
      - path: TestFixtures/test-v1.key
        buildPhase: resources
      - path: TestFixtures/test-v2.keyx
        buildPhase: resources
      - path: TestFixtures/test-arbitrary.key
        buildPhase: resources

  KeeForgeMacUITests:
    type: bundle.ui-testing
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: KeeForgeMac
    dependencies:
      - target: KeeForgeMac
    sources:
      - path: KeeForgeMacUITests
        excludes: ["README.md"]
      - path: TestFixtures/test.kdbx
        buildPhase: resources
      - path: TestFixtures/demo.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.key
        buildPhase: resources
      - path: TestFixtures/compatibility/attachments.kdbx
        buildPhase: resources

  KeeForgeMacTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keevault.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: KeeForgeMac
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KeeForgeMac.app/Contents/MacOS/KeeForgeMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
    # Same raw-catalog copy as on KeeForgeTests (see the comment there):
    # LocalizationTests compiles into this bundle too, and reads the four raw
    # .xcstrings sources from Bundle(for:), so they must travel with the Mac
    # test bundle as well.
    postCompileScripts:
      - name: Bundle raw .xcstrings catalogs for LocalizationTests
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/KeeForge/Resources/Localizable.xcstrings
          - $(SRCROOT)/KeeForge/Resources/InfoPlist.xcstrings
          - $(SRCROOT)/AutoFillExtension/Localizable.xcstrings
          - $(SRCROOT)/AutoFillExtension/InfoPlist.xcstrings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/KeeForge_Localizable.xcstrings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/KeeForge_InfoPlist.xcstrings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AutoFillExtension_Localizable.xcstrings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AutoFillExtension_InfoPlist.xcstrings
        script: |
          set -euo pipefail

          # TARGET_BUILD_DIR (not BUILT_PRODUCTS_DIR) is the location the test
          # bundle is actually assembled and run from — for a host-app-embedded
          # unit test that is KeeForgeMac.app/Contents/PlugIns/KeeForgeMacTests.xctest,
          # which is what Bundle(for:) resolves to at runtime.
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${dest}"

          copy_catalog() {
            src="$1"
            dst="$2"
            if [ ! -f "${src}" ]; then
              echo "error: raw xcstrings source missing: ${src}" >&2
              exit 1
            fi
            /bin/cp -f "${src}" "${dest}/${dst}"
          }

          copy_catalog "${SRCROOT}/KeeForge/Resources/Localizable.xcstrings" "KeeForge_Localizable.xcstrings"
          copy_catalog "${SRCROOT}/KeeForge/Resources/InfoPlist.xcstrings" "KeeForge_InfoPlist.xcstrings"
          copy_catalog "${SRCROOT}/AutoFillExtension/Localizable.xcstrings" "AutoFillExtension_Localizable.xcstrings"
          copy_catalog "${SRCROOT}/AutoFillExtension/InfoPlist.xcstrings" "AutoFillExtension_InfoPlist.xcstrings"
    dependencies:
      - target: KeeForgeMac
      - package: KeeForgeTwofish
    sources:
      - path: KeeForgeTests
        excludes: ["README.md"]
      - path: TestFixtures/test.kdbx
        buildPhase: resources
      - path: TestFixtures/demo.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.kdbx
        buildPhase: resources
      - path: TestFixtures/round-trip/unknown-elements.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/aes-baseline.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/password-keyfile.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/password-keyfile.key
        buildPhase: resources
      - path: TestFixtures/compatibility/unknown-rich.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/kdbx41-public-custom-data.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/legacy-kdbx31.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/attachments.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/foreign-chacha20.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/foreign-twofish.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/group-tags.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/unknown-inner-header.kdbx
        buildPhase: resources
      - path: TestFixtures/compatibility/argon2-high-iterations.kdbx
        buildPhase: resources
      - path: TestFixtures/test-v3-backup.kdbx
        buildPhase: resources
      - path: TestFixtures/demo-keyfile.key
        buildPhase: resources
      - path: TestFixtures/test-binary.key
        buildPhase: resources
      - path: TestFixtures/test-hex.key
        buildPhase: resources
      - path: TestFixtures/test-v1.key
        buildPhase: resources
      - path: TestFixtures/test-v2.keyx
        buildPhase: resources
      - path: TestFixtures/test-arbitrary.key
        buildPhase: resources

schemes:
  KeeForge:
    build:
      preActions:
        - script: |
            "${SRCROOT}/ci_scripts/prepare_build_config.sh" "${SRCROOT}"
          settingsTarget: KeeForge
      targets:
        KeeForge: all
        KeeForgeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: KeeForgeTests
          parallelizable: false
          randomExecutionOrder: true
        - name: KeeForgeUITests
          parallelizable: false
          randomExecutionOrder: false

  KeeForgeMac:
    build:
      preActions:
        - script: |
            "${SRCROOT}/ci_scripts/prepare_build_config.sh" "${SRCROOT}"
          settingsTarget: KeeForgeMac
